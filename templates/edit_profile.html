<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/edit_profile.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">
    <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
    <title>Editar Perfil</title>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <span>Infor Bot</span>
            <i class='bx bx-desktop'></i>
        </div>
        <div class="navbar-menu">
            <button class="menu-btn">
                <i class='bx bx-menu'></i>
            </button>
            <ul class="menu-dropdown">
                <li><a href="edit_profile.html" id="editar-btn">Sua conta</a></li>
                <li><a href="#" id="logout-btn">Sair</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="img-box">
            <label for="foto_upload" class="upload-label">
                <img id="preview-img" src="{{ foto_perfil }}" style="display: block;">
                <span class="upload-text">Clique para alterar foto</span>
            </label>
            <input type="file" id="foto_upload" name="foto_perfil" accept="image/*" onchange="mostrarPreview(event)">
        </div>
        <div class="form-box">
            <h1>Editar Perfil</h1>
            <form action="{{ url_for('editar_perfil') }}" method="POST" enctype="multipart/form-data">
                <div class="input-box">
                    <label for="nome">Nome Completo:</label>
                    <div class="input-group">
                        <input type="text" id="nome" name="nome" value="{{ user['nome'] }}" readonly>
                        <button type="button" class="edit-btn" onclick="habilitarEdicao('nome')">
                            <i class='bx bxs-edit'></i>
                        </button>
                    </div>
                </div>
                <div class="input-box">
                    <label for="usuario">Usuário:</label>
                    <div class="input-group">
                        <input type="text" id="usuario" name="usuario" value="{{ user['usuario'] }}" readonly>
                        <button type="button" class="edit-btn" onclick="habilitarEdicao('usuario')">
                            <i class='bx bxs-edit'></i>
                        </button>
                    </div>
                </div>
                <div class="input-box">
                    <label for="email">E-mail:</label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" value="{{ user['email'] }}" readonly>
                        <button type="button" class="edit-btn" onclick="habilitarEdicao('email')">
                            <i class='bx bxs-edit'></i>
                        </button>
                    </div>
                </div>
                <div class="input-box s">
                    <label for="senha">Senha:</label>
                    <div class="input-group">
                        <input type="password" id="senha" name="senha" value="{{ user['senha'] }}" readonly>
                        <button type="button" class="edit-btn" onclick="habilitarEdicao('senha')">
                            <i class='bx bxs-edit'></i>
                        </button>
                    </div>
                </div>
                <div class="input-box">
                    <label for="descricao">Descrição:</label>
                    <div class="input-group">
                        <textarea type="text" id="descricao" name="descricao" placeholder="Digite a sua descrição..." rows="3" readonly>{{ user['descricao'] }}</textarea>
                        <button type="button" class="edit-btn" onclick="habilitarEdicao('descricao')">
                            <i class='bx bxs-edit'></i>
                        </button>
                    </div>
                </div>
                <div class="button-group">
                    <button type="button" onclick="cancelarEdicao()">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/edit_profile.js"></script>
</body>
</html>
